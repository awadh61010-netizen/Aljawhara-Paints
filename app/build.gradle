plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aljawhara.paints'
    compileSdk 37
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.aljawhara.paints"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
